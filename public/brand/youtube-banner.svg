<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title description">
  <title id="title">notaproblem.dev YouTube banner</title>
  <desc id="description">A paper-colored YouTube banner with the square notaproblem.dev logo and the slogan founded to build products people enjoy inside the central safe area.</desc>

  <rect width="2560" height="1440" fill="#efe9dd"/>

  <g transform="translate(610 550) scale(0.33203125)">
    <rect width="1024" height="1024" rx="112" fill="#050505"/>
    <g fill="#f3f3f3" font-family="'Space Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="220" font-weight="700">
      <text x="48" y="320">not a</text>
      <text x="48" y="565">problem</text>
      <text x="48" y="810" xml:space="preserve">   .dev</text>
    </g>
  </g>

  <g fill="#161616" font-family="'Space Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="73" font-weight="400">
    <text x="1020" y="656">founded to build</text>
    <text x="1020" y="738">products people enjoy.</text>
  </g>
</svg>
